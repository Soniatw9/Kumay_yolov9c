task: detect
mode: train
model: yolov8s.pt
data: /kaggle/working/data.yaml
# 大約在 130-140 時跑出最佳loss值，接下來不降反升。
epochs: 300 
# 最高只准跑10小時，達標會自動停止訓練。
time: 10 
# 可考慮改為 20-30
patience: 40 
# 64 for 1 GPU, 128 for 2 GPUs
batch: 128 
imgsz: 640
save: true
# 每10個epoch儲存一次
save_period: 10 
cache: /kaggle/working/yolo_cache
# 告訴YOLO有兩個GPU 0 和 1
device: 0,1 
# 要求 CPU 分配 12 個工作線程給 GPU，釋放 GPU 潛能。與 batch_size, IMGSZ 連動決定 VRAM 使用量。
workers: 12 
project: /kaggle/working/runs/train
name: yolov8s_07144
exist_ok: false
pretrained: true
# 自動超參選用的優化器
optimizer: AdamW
verbose: true
seed: 0
deterministic: true
single_cls: true
rect: false
# 自動超參選用的學習率調度器
cos_lr: true
close_mosaic: 50
# 非延續之前的訓練
resume: false
# 開啟 AMP (自動混合精度訓練) 加速 GPU 處理速度
amp: true
fraction: 1.0
profile: false
freeze: null
multi_scale: false
overlap_mask: true
mask_ratio: 4
dropout: 0.0
val: true
split: val
save_json: false
conf: null
# 設定預測的框框重疊閾值，重疊閾值低於此比例的物件將被忽略
iou: 0.7
max_det: 300
half: false
dnn: false
# 產生訓練相關圖表
plots: true
source: null
vid_stride: 1
stream_buffer: false
visualize: false
augment: false
agnostic_nms: false
classes: null
retina_masks: false
embed: null
show: false
save_frames: false
save_txt: false
save_conf: false
save_crop: false
show_labels: true
show_conf: true
show_boxes: true
line_width: null
format: torchscript
keras: false
optimize: false
int8: false
dynamic: false
simplify: true
opset: null
workspace: null
nms: false

# 下面數直接為YOLO tune及Optuna自動超參選用的超參數
lr0: 0.00038
lrf: 0.08
momentum: 0.937
weight_decay: 0.0006
warmup_epochs: 5.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 1.2
dfl: 1.5
pose: 12.0
kobj: 1.0
nbs: 64
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5
translate: 0.3
scale: 0.24
shear: 0.0
perspective: 0.0
flipud: 0
fliplr: 0.25
bgr: 0.0
mosaic: 0.125
mixup: 0.08
cutmix: 0.0
copy_paste: 0
copy_paste_mode: flip
# 自選超參到這邊

auto_augment: randaugment
erasing: 0.4
cfg: null
tracker: botsort.yaml
save_dir: /kaggle/working/runs/train/yolov8s_07144
